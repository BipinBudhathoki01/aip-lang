name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and minimal example
      description: Include a small prompt and the command you ran. Remove API keys and private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, PHP, and AIP version or commit
